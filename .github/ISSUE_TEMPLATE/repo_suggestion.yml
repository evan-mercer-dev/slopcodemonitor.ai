name: Suggest a Repository to Scan
description: Propose an open-source GitHub repository for inclusion in the next SlopCodeMonitor scan cycle.
title: "[Repo Suggestion] "
labels: ["repo-suggestion"]
body:
  - type: input
    id: repo_url
    attributes:
      label: GitHub Repository URL
      description: Full URL of the public GitHub repository
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should we scan this repository?
      description: Optional context (widely used dependency, rapid growth, governance benchmark interest, etc.)
